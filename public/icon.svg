<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="70%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <linearGradient id="neonOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark cockpit background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#222733" stroke-width="4"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#161922" stroke-width="2"/>

  <!-- Gauge Arc Track (Dark) -->
  <!-- 240 degree sweep from 150 deg (left bottom) to 390 deg/30 deg (right bottom) -->
  <path d="M 100.4 345.8 A 180 180 0 1 1 411.6 345.8" 
        fill="none" stroke="#1a202c" stroke-width="18" stroke-linecap="round"/>

  <!-- Gauge Arc Active Neon Section -->
  <path d="M 100.4 345.8 A 180 180 0 0 1 310 82" 
        fill="none" stroke="url(#neonOrange)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Dial Ticks -->
  <!-- 0 km/h tick -->
  <line x1="126.8" y1="330.5" x2="147.5" y2="318.6" stroke="#4a5568" stroke-width="4" stroke-linecap="round"/>
  <!-- 40 km/h tick -->
  <line x1="86" y1="256" x2="110" y2="256" stroke="#ff7700" stroke-width="4" stroke-linecap="round"/>
  <!-- 80 km/h tick -->
  <line x1="126.8" y1="181.5" x2="147.5" y2="193.4" stroke="#ff7700" stroke-width="4" stroke-linecap="round"/>
  <!-- 120 km/h tick (top) -->
  <line x1="256" y1="86" x2="256" y2="110" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
  <!-- 160 km/h tick -->
  <line x1="385.2" y1="181.5" x2="364.5" y2="193.4" stroke="#718096" stroke-width="4" stroke-linecap="round"/>
  <!-- 200 km/h tick -->
  <line x1="426" y1="256" x2="402" y2="256" stroke="#e53e3e" stroke-width="4" stroke-linecap="round"/>

  <!-- Speedometer Needle (Glowing Orange) pointing ~130 km/h -->
  <!-- Center is 256, 256. Angle ~15 deg past 12 o'clock -->
  <polygon points="256,236 308,128 262,256" fill="url(#neonOrange)" filter="url(#glow)"/>
  <line x1="256" y1="256" x2="308" y2="128" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Hub with Neon Ring -->
  <circle cx="256" cy="256" r="32" fill="#12151c" stroke="#ff6a00" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ff7700"/>

  <!-- Digital Readout Preview Inside Icon -->
  <text x="256" y="380" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" text-anchor="middle" letter-spacing="2">MOTO</text>
  <text x="256" y="415" fill="#ff7700" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle" letter-spacing="4">GPS HUD</text>
</svg>
